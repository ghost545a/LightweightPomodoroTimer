[package]
name = "PomodoroTimer"
version = "0.2.2"
edition = "2024"

[dependencies]
slint = { version = "1.13.0", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "1.13.0"

[profile.release]
strip = true      # Deletes debug symbols from the binary
opt-level = "z"   # Optimize for size
lto = true        # Enables Link-Time Optimization (optimization at linking stage)
codegen-units = 1 # Less amount of compilation units for more optimization
panic = "abort"
